  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8e6ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#5fc8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecca5e"/>
      <stop offset=".5" stop-color="#6b4d10"/>
